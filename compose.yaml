services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: ./web-app
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/project_db
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data: